[project]
name = "ai-project-backend"
version = "0.1.0"
description = "Stacklane AI-project backend: FastAPI + Celery workflow engine + pgvector RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai>=0.4",
    "openai>=1.60",
    "structlog>=24.4",
    "boto3>=1.35",
    "fastapi-users[sqlalchemy]>=14.0",
    "httpx>=0.28",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
# PDF parsing is heavy (docling pulls torch); install only where ingestion
# of PDFs is needed: `uv sync --extra docling`. The API image stays slim.
docling = ["docling>=2.15"]
# LLM observability; the app no-ops when LANGFUSE_* env vars are absent.
langfuse = ["langfuse>=2.57"]
# Error tracking; the app no-ops when SENTRY_DSN is absent.
sentry = ["sentry-sdk[fastapi]>=2.20"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: Depends(...) / Query(...) in
# argument defaults. Same reasoning for both: FastAPI reads them at import
# time to build the OpenAPI schema, and they are never mutated.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.security.HTTPBearer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs live Postgres/Redis/OpenAI (deselect with '-m \"not integration\"')",
]
